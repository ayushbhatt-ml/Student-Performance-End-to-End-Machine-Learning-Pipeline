<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Exam Performance Indicator</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }
        .card-custom {
            max-width: 600px;
            width: 100%;
            border-radius: 12px;
            border: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }
        .card-header {
            background-color: #0d6efd;
            color: white;
            border-top-left-radius: 12px !important;
            border-top-right-radius: 12px !important;
            padding: 1.5rem;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="card card-custom">
    <div class="card-header">
        <h2 class="h4 mb-0">Student Exam Performance Prediction</h2>
    </div>
    
    <div class="card-body p-4">
        <form action="{{ url_for('predict_datapoint') }}" method="post">
            
            <div class="row g-3">
                <!-- Gender -->
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="gender">Gender</label>
                    <select class="form-select" id="gender" name="gender" required>
                        <option value="" selected disabled>Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <!-- Race/Ethnicity -->
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="ethnicity">Race or Ethnicity</label>
                    <select class="form-select" id="ethnicity" name="ethnicity" required>
                        <option value="" selected disabled>Select Ethnicity</option>
                        <option value="group A">Group A</option>
                        <option value="group B">Group B</option>
                        <option value="group C">Group C</option>
                        <option value="group D">Group D</option>
                        <option value="group E">Group E</option>
                    </select>
                </div>
            </div>

            <!-- Parental Education -->
            <div class="mb-3">
                <label class="form-label" for="parental_education">Parental Level of Education</label>
                <select class="form-select" id="parental_education" name="parental_level_of_education" required>
                    <option value="" selected disabled>Select Parent's Education</option>
                    <option value="associate's degree">Associate's Degree</option>
                    <option value="bachelor's degree">Bachelor's Degree</option>
                    <option value="high school">High School</option>
                    <option value="master's degree">Master's Degree</option>
                    <option value="some college">Some College</option>
                    <option value="some high school">Some High School</option>
                </select>
            </div>

            <div class="row g-3">
                <!-- Lunch Type -->
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="lunch">Lunch Type</label>
                    <select class="form-select" id="lunch" name="lunch" required>
                        <option value="" selected disabled>Select Lunch Type</option>
                        <option value="standard">Standard</option>
                        <option value="free/reduced">Free/Reduced</option>
                    </select>
                </div>

                <!-- Test Prep Course -->
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="test_prep">Test Prep Course</label>
                    <select class="form-select" id="test_prep" name="test_preparation_course" required>
                        <option value="" selected disabled>Select Status</option>
                        <option value="none">None</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
            </div>

            <div class="row g-3">
                <!-- Reading Score -->
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="reading_score">Reading Score (out of 100)</label>
                    <input class="form-control" type="number" id="reading_score" name="reading_score"
                           placeholder="Enter Reading Score" min="0" max="100" required />
                </div>

                <!-- Writing Score -->
                <div class="col-md-6 mb-4">
                    <label class="form-label" for="writing_score">Writing Score (out of 100)</label>
                    <input class="form-control" type="number" id="writing_score" name="writing_score"
                           placeholder="Enter Writing Score" min="0" max="100" required />
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2">
                Predict Maths Score
            </button>
        </form>

        <!-- Dynamic Prediction Results -->
        {% if results %}
        <div class="alert alert-success mt-4 text-center mb-0" role="alert">
            <h3 class="h5 mb-1">Predicted Math Score</h3>
            <span class="fs-2 fw-bold">{{ results }}</span>
        </div>
        {% endif %}

    </div>
</div>

</body>
</html>
