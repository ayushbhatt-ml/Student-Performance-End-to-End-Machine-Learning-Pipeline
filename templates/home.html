<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Exam Performance Predictor</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .card-custom {
            max-width: 650px;
            width: 100%;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            transition: transform 0.2s ease;
        }

        .card-header-custom {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            color: white;
            padding: 2rem 1.5rem;
            text-align: center;
            position: relative;
        }

        .card-header-custom h2 {
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #495057;
            margin-bottom: 0.5rem;
        }

        .form-select, .form-control {
            border-radius: 8px;
            padding: 0.625rem 0.875rem;
            border: 1px solid #ced4da;
            transition: all 0.2s ease-in-out;
        }

        .form-select:focus, .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }

        .btn-predict {
            background: linear-gradient(135deg, #0d6efd 0%, #0b5ed7 100%);
            border: none;
            border-radius: 8px;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: all 0.2s ease;
        }

        .btn-predict:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
        }

        .result-box {
            border-radius: 12px;
            background: #e8f5e9;
            border: 1px solid #a5d6a7;
            color: #1b5e20;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="card card-custom">
    <div class="card-header-custom">
        <i class="bi bi-mortarboard-fill display-5 mb-2 d-block"></i>
        <h2 class="h4 mb-1">Student Exam Performance</h2>
        <p class="mb-0 opacity-75 fs-6">Predict predicted mathematics score using ML model inputs</p>
    </div>
    
    <div class="card-body p-4 p-md-5">
        <form action="{{ url_for('predict_datapoint') }}" method="post">
            
            <div class="row g-3 mb-3">
                <!-- Gender -->
                <div class="col-md-6">
                    <label class="form-label" for="gender">
                        <i class="bi bi-gender-ambiguous me-1"></i> Gender
                    </label>
                    <select class="form-select" id="gender" name="gender" required>
                        <option value="" selected disabled>Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <!-- Race/Ethnicity -->
                <div class="col-md-6">
                    <label class="form-label" for="ethnicity">
                        <i class="bi bi-people me-1"></i> Race or Ethnicity
                    </label>
                    <select class="form-select" id="ethnicity" name="ethnicity" required>
                        <option value="" selected disabled>Select Ethnicity</option>
                        <option value="group A">Group A</option>
                        <option value="group B">Group B</option>
                        <option value="group C">Group C</option>
                        <option value="group D">Group D</option>
                        <option value="group E">Group E</option>
                    </select>
                </div>
            </div>

            <!-- Parental Education -->
            <div class="mb-3">
                <label class="form-label" for="parental_education">
                    <i class="bi bi-book me-1"></i> Parental Level of Education
                </label>
                <select class="form-select" id="parental_education" name="parental_level_of_education" required>
                    <option value="" selected disabled>Select Parent's Education</option>
                    <option value="associate's degree">Associate's Degree</option>
                    <option value="bachelor's degree">Bachelor's Degree</option>
                    <option value="high school">High School</option>
                    <option value="master's degree">Master's Degree</option>
                    <option value="some college">Some College</option>
                    <option value="some high school">Some High School</option>
                </select>
            </div>

            <div class="row g-3 mb-3">
                <!-- Lunch Type -->
                <div class="col-md-6">
                    <label class="form-label" for="lunch">
                        <i class="bi bi-egg-fried me-1"></i> Lunch Type
                    </label>
                    <select class="form-select" id="lunch" name="lunch" required>
                        <option value="" selected disabled>Select Lunch Type</option>
                        <option value="standard">Standard</option>
                        <option value="free/reduced">Free/Reduced</option>
                    </select>
                </div>

                <!-- Test Prep Course -->
                <div class="col-md-6">
                    <label class="form-label" for="test_prep">
                        <i class="bi bi-journal-check me-1"></i> Test Prep Course
                    </label>
                    <select class="form-select" id="test_prep" name="test_preparation_course" required>
                        <option value="" selected disabled>Select Status</option>
                        <option value="none">None</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <!-- Reading Score -->
                <div class="col-md-6">
                    <label class="form-label" for="reading_score">
                        <i class="bi bi-file-earmark-text me-1"></i> Reading Score (0–100)
                    </label>
                    <input class="form-control" type="number" id="reading_score" name="reading_score"
                           placeholder="e.g. 75" min="0" max="100" required />
                </div>

                <!-- Writing Score -->
                <div class="col-md-6">
                    <label class="form-label" for="writing_score">
                        <i class="bi bi-pencil-square me-1"></i> Writing Score (0–100)
                    </label>
                    <input class="form-control" type="number" id="writing_score" name="writing_score"
                           placeholder="e.g. 80" min="0" max="100" required />
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-predict w-100 py-2.5 fs-6">
                <i class="bi bi-calculator me-2"></i>Predict Math Score
            </button>
        </form>

        <!-- Dynamic Prediction Results -->
        {% if results %}
        <div class="result-box p-3 mt-4 text-center" role="status">
            <span class="d-block text-uppercase fw-bold text-muted small mb-1">Estimated Output</span>
            <div class="d-flex align-items-center justify-content-center gap-2">
                <i class="bi bi-check-circle-fill fs-3 text-success"></i>
                <span class="fs-1 fw-bold text-dark">{{ results }}</span>
                <span class="fs-5 text-muted">/ 100</span>
            </div>
        </div>
        {% endif %}

    </div>
</div>

</body>
</html>
