<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Student Performance Indicator</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1.5rem;
        }

        .hero-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            padding: 3.5rem 2.5rem;
            text-align: center;
        }

        .icon-badge {
            width: 85px;
            height: 85px;
            background: rgba(79, 70, 229, 0.1);
            color: #4f46e5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.75rem;
            margin: 0 auto 1.5rem auto;
        }

        .main-title {
            font-size: 2rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 0.75rem;
            letter-spacing: -0.5px;
        }

        .description {
            font-size: 1rem;
            color: #6b7280;
            margin-bottom: 2.25rem;
            line-height: 1.6;
        }

        .btn-start {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            color: #ffffff;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 0.9rem 2.5rem;
            border-radius: 12px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.35);
        }

        .btn-start:hover {
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.5);
        }
    </style>
</head>
<body>

<div class="hero-card">
    <div class="icon-badge">
        🎓
    </div>
    <h1 class="main-title">Student Exam Performance Indicator</h1>
    <p class="description">
        Welcome to the Performance Prediction Portal. Input demographic metrics, course completion, and literacy scores to estimate a student's final Math test outcome.
    </p>
    
    <!-- Links to /predictdata -->
    <a href="{{ url_for('predict_datapoint') }}" class="btn-start">
        Go to Prediction Page &rarr;
    </a>
</div>

</body>
</html>
